[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar10-generated-analysis-portfolio"
version = "0.1.0"
description = "Reproducible analysis utilities reconstructed from a CIFAR-10 GAN assignment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyter>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
