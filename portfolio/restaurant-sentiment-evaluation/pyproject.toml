[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-sentiment-portfolio"
version = "0.1.0"
description = "Leakage-safe restaurant-review sentiment evaluation reconstructed from DATA 460 coursework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyter>=1,<2"]
vader = ["nltk>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
