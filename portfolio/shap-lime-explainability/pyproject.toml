[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-portfolio"
version = "0.1.0"
description = "Reproducible SHAP/LIME explainability comparison reconstructed from historical coursework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.8,<1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
xai = [
  "shap>=0.50,<0.53",
  "lime==0.2.0.1",
  "matplotlib>=3.9,<4",
  "jupyter>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
