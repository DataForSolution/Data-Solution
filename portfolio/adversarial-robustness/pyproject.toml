[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-robustness-portfolio"
version = "0.1.0"
description = "Reproducible adversarial-robustness evaluation utilities reconstructed from coursework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyter>=1,<2"]
art = ["adversarial-robustness-toolbox==1.20.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
