[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness-evaluation-portfolio"
version = "0.1.0"
description = "Reproducible fairness-metric and threshold evaluation utilities reconstructed from AIF360 coursework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyter>=1,<2"]
aif360 = ["aif360>=0.6.1,<0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
