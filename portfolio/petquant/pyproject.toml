[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petquant-portfolio"
version = "0.1.0"
description = "Reproducible, safety-oriented utilities reconstructed from the PETQuant project"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyter>=1,<2", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
